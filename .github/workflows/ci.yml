name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python ${{ matrix.python }}
      # CPU torch so the checkpoint-loading tests run; ESM-2 weights are never downloaded in CI.
      - run: uv pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: uv pip install -e ".[ml,dev]"
      - run: uv run --no-sync ruff check src tests eval scripts
      - run: uv run --no-sync pytest --cov --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bioretrieval-mcp .
      - name: Smoke test streamable HTTP
        run: |
          docker run -d --name mcp -p 8000:8000 bioretrieval-mcp
          for i in $(seq 1 30); do
            curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/mcp \
              -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
              -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
              | grep -q 200 && exit 0
            sleep 1
          done
          docker logs mcp; exit 1
