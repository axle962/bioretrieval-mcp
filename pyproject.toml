[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bioretrieval-mcp"
version = "0.1.0"
description = "MCP server exposing cryo-EM, protein, and DNA-methylation retrieval tools to LLM agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Aditya MG", email = "am16489@nyu.edu" }]
keywords = ["mcp", "cryo-em", "emdb", "uniprot", "esm-2", "geo", "dna-methylation", "retrieval"]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "pydantic>=2.7",
    "numpy>=1.26",
]

[project.optional-dependencies]
# ESM-2 embeddings and two-tower retrieval. Kept optional so the API tools
# (EMDB / UniProt / GEO) run in a slim image without torch.
ml = ["torch>=2.2", "fair-esm>=2.0"]
eval = ["anthropic>=2.1"]
dev = ["pytest>=8", "pytest-cov>=5", "anyio>=4", "ruff>=0.6"]

[project.scripts]
bioretrieval-mcp = "bioretrieval_mcp.server:main"

[project.urls]
Repository = "https://github.com/axle962/bioretrieval-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/bioretrieval_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: hits real public APIs (deselect with -m 'not live')",
    "ml: needs torch + fair-esm",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["bioretrieval_mcp"]
